[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windagent"
version = "0.1.0"
description = "Agentic AI for hourly wind-farm generation forecasting with strict as-of weather data"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
windagent = "windagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running end-to-end tests",
    "network: tests that call external APIs (skipped when WINDAGENT_OFFLINE=1)",
]
